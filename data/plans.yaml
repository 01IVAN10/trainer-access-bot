# Тарифи каналу «Сила вдома».
# Змінювати можна без правки коду — після зміни перезапусти бота.
# Якщо щось заповнено неправильно, бот не запуститься і напише, що саме не так.
#
# id          — внутрішня назва (латиниця, цифри, _). Після запуску НЕ змінювати:
#               вона записана в оплатах і підписках у базі.
# price       — ціна у ГРИВНЯХ, ціле число (у копійки для mono код переведе сам).
# duration    — скільки діє доступ. Формат: число + одиниця:
#               m — хвилини, h — години, d — дні. Наприклад: 5m, 12h, 30d.
#               «Місяць» = 30d: однакова тривалість для всіх, без сюрпризів з лютим.
# reminders   — за скільки ДО закінчення нагадати про продовження, від більшого до меншого.
# grace       — пільговий період ПІСЛЯ закінчення: доступ ще зберігається, бот пише
#               «підписка закінчилась», а коли grace мине — видаляє з каналу. 0m = видалити одразу.
# demo        — тестовий тариф для портфоліо (у боті для реального клієнта його не буде).

plans:
  - id: demo
    title: "Демо — 5 хвилин"
    description: "Тестова оплата, щоб за 7 хвилин побачити весь цикл: доступ → нагадування → видалення."
    price: 10
    duration: 5m
    reminders: [2m, 1m]
    grace: 1m
    demo: true

  - id: month
    title: "1 місяць"
    description: "30 днів доступу до всіх тренувань каналу."
    price: 490
    duration: 30d
    reminders: [3d, 1d]
    grace: 1d

  - id: quarter
    title: "3 місяці"
    description: "90 днів доступу. Вигідніше на 12%, ніж платити щомісяця."
    price: 1290
    duration: 90d
    reminders: [3d, 1d]
    grace: 1d
